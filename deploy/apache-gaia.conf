ProxyPass /gaia/api/ http://127.0.0.1:8765/api/ retry=0 timeout=65
ProxyPassReverse /gaia/api/ http://127.0.0.1:8765/api/

<Location /gaia/api/>
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
</Location>

<IfModule mod_headers.c>
    <LocationMatch "^/gaia/?$|^/gaia/index\.html$">
        Header always set Cache-Control "no-store, max-age=0"
    </LocationMatch>
    <LocationMatch "^/gaia/assets/">
        Header always set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
</IfModule>
