# No image requests go to Revontuli. Google authentication runs locally.
ProxyPass /gaia/auth/ http://127.0.0.1:18766/gaia/auth/
ProxyPassReverse /gaia/auth/ http://127.0.0.1:18766/gaia/auth/
ProxyPass /gaia/restricted/ http://127.0.0.1:18766/gaia/restricted/
ProxyPassReverse /gaia/restricted/ http://127.0.0.1:18766/gaia/restricted/
ProxyPass /gaia/history/ http://127.0.0.1:18766/gaia/history/
ProxyPassReverse /gaia/history/ http://127.0.0.1:18766/gaia/history/
# Legacy mixed-image URLs must never bypass authentication.
<LocationMatch "^/gaia/(public|api)(/|$)">
 Require all denied
 Header always set Cache-Control "no-store"
</LocationMatch>
Alias /gaia/open/ /mnt/shovel/gaia/serving/open/
<Directory /mnt/shovel/gaia/serving/open/>
 Options -Indexes
 AllowOverride None
 Require all granted
</Directory>
<LocationMatch "^/gaia/(auth|restricted|history)(/|$)">
 Header always set Cache-Control "private, no-store"
 Header always set Vary "Cookie"
</LocationMatch>
<LocationMatch "^/gaia/?$|^/gaia/index\.html$|^/gaia/open/.*manifest\.json$">
 Header always set Cache-Control "no-store"
</LocationMatch>
<LocationMatch "^/gaia/(open/)?assets/">
 Header always set Cache-Control "public, max-age=86400"
 Header always set Cache-Control "no-store" "expr=%{REQUEST_STATUS} >= 400"
</LocationMatch>

Alias /gaia/ /mnt/shovel/gaia/www/
<Directory /mnt/shovel/gaia/>
 Options -Indexes
 AllowOverride None
 Require all denied
</Directory>
<Directory /mnt/shovel/gaia/www/>
 Require all granted
</Directory>
<Directory /mnt/shovel/gaia/serving/open/>
 Require all granted
</Directory>
