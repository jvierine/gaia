# Static-only public viewer. No upstream backend or admin API.
Alias /gaia/public/ /mnt/shovel/gaia/public/
<Directory /mnt/shovel/gaia/public/>
    Options -Indexes
    Require all granted
</Directory>
<Location /gaia/api/>
    Require all denied
</Location>
<IfModule mod_headers.c>
    <LocationMatch "^/gaia/?$|^/gaia/index\.html$|^/gaia/public/manifest\.json$">
        Header always set Cache-Control "no-store, max-age=0"
    </LocationMatch>
    <LocationMatch "^/gaia/(public/)?assets/">
        Header always set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
</IfModule>
