# Standalone deployment: every upstream below is local to Revontuli.
ProxyPass /gaia/api/ http://127.0.0.1:18765/api/ retry=0 timeout=30
ProxyPassReverse /gaia/api/ http://127.0.0.1:18765/api/
# Locally published magnetic-weighted composite: the same manifest and stitched
# atlas assets rsynced to juha.no. Both the public and admin shells load stations
# and imagery from /gaia/public/manifest.json, so Revontuli must serve it too.
# This alias is more specific than /gaia/ and must precede it (first match wins).
Alias /gaia/public/ /mnt/data/juha/gaia/public/
<Directory /mnt/data/juha/gaia/public/>
    Require all granted
</Directory>
<IfModule mod_headers.c>
    # Content-hashed stitched assets are immutable; the manifest is fetched no-store by the client.
    <LocationMatch "^/gaia/public/assets/">
        Header always set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
</IfModule>
Alias /gaia/ /mnt/data/juha/gaia/code/web-dist/
<Directory /mnt/data/juha/gaia/code/web-dist/>
    Require all granted
    DirectoryIndex index.html
</Directory>
Alias /aida/ /home/j/src/widefield-star-calibrator/
<Directory /home/j/src/widefield-star-calibrator/>
    Require all granted
    DirectoryIndex index.html
</Directory>
# AIDA's existing test-case API; calibration uploads use GAIA's Rust API.
ProxyPass /api/test-cases http://127.0.0.1:18790/api/test-cases
ProxyPassReverse /api/test-cases http://127.0.0.1:18790/api/test-cases
